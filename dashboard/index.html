    <title>Support Dashboard - Trelk Bot</title>
    <script>
      // Prevent flash of wrong theme - apply before CSS loads
      (function () {
        try {
          var stored = localStorage.getItem("trelk-theme");
          var theme = "dark"; // default
          if (stored) {
            var parsed = JSON.parse(stored);
            theme = parsed.state?.theme || "dark";
          }
          if (theme === "system") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <script src="https://s.trelk.site/api/widget/trelk-chat.js"></script>
